html:`<div class="tline" id="tl2">${MOM.map((m,i)=>`<button class="seg2${i?'':' on'}" style="flex:${m.min}" data-i="${i}"><b>${m.n}</b><span>${m.min} min</span></button>`).join('')}</div>
<div class="row" style="margin-top:18px;align-items:stretch">
  <div class="card infocard fl1" id="d2" style="min-height:130px;padding:20px 28px"></div>
  <div class="card timer"><div class="tm" id="tm2">10:00</div><button class="btn" id="tb2">▶ Iniciar</button></div>
</div>
<div class="hint" style="margin-top:16px"><i></i><span>Toca un momento: se resaltan los resultados de aprendizaje que se trabajan y puedes iniciar el cronómetro.</span></div>
<div class="outs" id="o2">${OUT.map((t,i)=>`<div class="out1"><b>${i+1}</b>${t}</div>`).join('')}</div>`,
init(s){let sel=0,left=MOM[0].min*60;const tm=$('#tm2',s),tb=$('#tb2',s);
  const fmt=v=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
  function stop(){clearInterval(tmr);tmr=null;tb.textContent='▶ Iniciar'}
  function show(i){sel=i;stop();left=MOM[i].min*60;tm.textContent=fmt(left);
    put($('#d2',s),`<h4>${MOM[i].n} · ${MOM[i].min} minutos</h4><p>${MOM[i].t}</p>`);
    $$('.out1',s).forEach((o,k)=>o.classList.toggle('hl',MOM[i].o.includes(k)))}
  bindList(s,'.seg2',show);show(0);
  tb.onclick=()=>{if(tmr){stop();return}tb.textContent='❚❚ Pausar';tmr=setInterval(()=>{left--;tm.textContent=fmt(Math.max(left,0));if(left<=0)stop()},1000)};
}});

/* ---------- 3 · APERTURA ---------- */
add({t:'dark',title:'Apertura: ¿qué es administrar?',k:'Apertura',h:'¿Qué entendemos por administración gerencial?',
html:`<div class="row">
 <div class="col" style="width:760px">
  <div class="card qcard"><q>La eficiencia consiste en <em>hacer bien las cosas</em>; la eficacia, en <em>hacer las cosas correctas</em>.</q><small>Frase atribuida con frecuencia a Peter Drucker</small></div>
  <button class="btn" id="pq3" style="align-self:flex-start">Pregunta detonante ▸</button>
  <div class="card infocard" id="pc3" style="min-height:150px;padding:20px 28px;display:none"><h4>Para conversar</h4><p>¿Por qué una empresa puede ejecutar tareas con rapidez y, aun así, no resolver el problema que realmente importa?</p></div>
 </div>
 <div class="col fl1">
  <p style="font-size:26px;line-height:1.45">Proceso mediante el cual quienes dirigen <b class="gold">definen objetivos, organizan recursos, orientan a las personas, conectan esfuerzos y evalúan resultados</b> para crear valor para clientes, colaboradores, propietarios, aliados y sociedad.</p>
  <div class="triad" id="tr3">
   <button class="lb on"><span class="n">1</span><span>Criterio para decidir</span></button>
   <button class="lb"><span class="n">2</span><span>Capacidad para movilizar a las personas</span></button>
   <button class="lb"><span class="n">3</span><span>Disciplina para convertir decisiones en acciones verificables</span></button>
  </div>
  <div class="card infocard" id="td3" style="min-height:100px;padding:16px 24px"></div>
 </div>
</div>
<div class="banner card" style="margin-top:20px"><b>Idea central.</b> Administrar no es solamente dar instrucciones ni vigilar tareas: es convertir propósitos en resultados mediante decisiones coherentes sobre personas, recursos, procesos y relaciones con el entorno.</div>`,
init(s){const T=['Comprende el negocio, interpreta datos y asume la responsabilidad por las consecuencias de lo que decide.','Escucha a quienes ejecutan el trabajo y orienta los esfuerzos hacia un propósito compartido.','Transforma lo decidido en acciones que se pueden comprobar: responsables, plazos y resultados.'];
  bindList($('#tr3',s),'.lb',i=>put($('#td3',s),`<p>${T[i]}</p>`));put($('#td3',s),`<p>${T[0]}</p>`);
  $('#pq3',s).onclick=()=>{const c=$('#pc3',s);c.style.display='block';pop(c)}},
enter(s){$('#pc3',s).style.display='none'}});

/* ---------- 4 · EFICACIA ---------- */
const EFI=[{n:'Eficacia',d:'Alcanzar el objetivo previsto.',e:'Una institución logra que el 90 % de sus estudiantes complete la inducción.'},
 {n:'Eficiencia',d:'Usar adecuadamente tiempo, dinero y recursos.',e:'La institución alcanza ese resultado sin duplicar sesiones ni desperdiciar materiales.'},
 {n:'Efectividad',d:'Lograr resultados relevantes y sostenibles en la práctica.',e:'Los estudiantes no solo asisten: comprenden los servicios y los utilizan durante el semestre.'}];
add({t:'light',title:'Eficacia, eficiencia y efectividad',k:'1.1 Conceptos base',h:'Eficacia, eficiencia y efectividad',
html:`<div class="row">
 <div class="col" style="width:560px" id="l4">${EFI.map((x,i)=>`<button class="lb${i?'':' on'}" style="padding:22px 24px;font-size:32px"><span class="n" style="width:50px;height:50px;font-size:24px">${i+1}</span><span>${x.n}<small style="font-size:22px;margin-top:6px">${x.d}</small></span></button>`).join('')}</div>
 <div class="card det fl1" id="d4" style="min-height:420px"></div>
</div>
<div class="row" style="margin-top:22px;align-items:flex-start">
 <button class="btn" id="a4">Ejemplo de alerta ▸</button>
 <div class="banner card fl1" id="al4" style="display:none;font-size:27px"><b>Ejemplo de alerta.</b> Una empresa puede reducir costos cerrando todos los puntos de atención presencial. El indicador de gasto mejora, pero si aumentan las quejas y se pierden clientes, la decisión puede ser eficiente en apariencia y poco efectiva en términos globales.</div>
</div>`,
init(s){const f=i=>put($('#d4',s),`<h4 style="font-size:56px">${EFI[i].n}</h4><span class="lbl">En palabras sencillas</span><p style="font-size:36px;font-weight:700;line-height:1.3">${EFI[i].d}</p><span class="lbl" style="margin-top:22px">Ejemplo empresarial</span><p style="font-size:29px">${EFI[i].e}</p>`);
  bindList($('#l4',s),'.lb',f);f(0);$('#a4',s).onclick=()=>{const a=$('#al4',s);a.style.display='block';pop(a)}},
enter(s){$('#al4',s).style.display='none'}});

/* ---------- 5 · FUNCIONES ---------- */
const FUN=[
 {n:'Planificación',q:'¿Qué queremos lograr?',h:'Decidir antes de actuar',d:'Definir qué se quiere conseguir, por qué es importante, qué acciones, recursos y responsables se requieren, en qué plazo y cómo se comprobará el avance. Reduce la improvisación, aunque no elimina la incertidumbre.',c:['Diagnóstico','Objetivos claros y medibles','Acciones y recursos','Riesgos y supuestos','Seguimiento'],
  a:'Una empresa de distribución quiere disminuir las entregas tardías. En lugar de ordenar «trabajar más rápido», analiza causas, fija la meta de bajar del 18 % al 8 % en seis meses, identifica rutas críticas, asigna responsables y revisa cada semana.',
  m:'Se anuncia una nueva sede porque «la zona está creciendo», pero no se estudia la demanda, los costos logísticos, el personal ni el punto de equilibrio. La decisión puede consumir recursos sin generar suficiente actividad.'},
 {n:'Organización',q:'¿Con qué y con quiénes?',h:'Distribuir recursos y responsabilidades',d:'Definir qué actividades deben realizarse, cómo se agrupan, quién decide, quién responde por cada resultado y cómo fluirá la información.',c:['Claridad de funciones','Autoridad proporcional a la responsabilidad','Diseño de procesos','Asignación de recursos'],
  a:'En una clínica, recepción, facturación, enfermería y atención al usuario acuerdan un flujo común para reducir la espera. Cada área sabe qué entrega, qué recibe y quién resuelve las excepciones.',
  m:'Dos coordinaciones creen que la otra debe aprobar una compra. El trámite se detiene y cada área culpa a la otra. El problema no es necesariamente falta de compromiso: es un diseño de responsabilidades deficiente.'},
 {n:'Dirección',q:'¿Cómo movilizamos?',h:'Movilizar personas hacia el propósito',d:'Comunicar prioridades, orientar, motivar, decidir, resolver conflictos y dar retroalimentación, creando condiciones para que las personas puedan realizar el trabajo. No es ordenar de manera permanente: también es escuchar y desarrollar capacidades.',c:['Comunicación clara','Liderazgo coherente','Motivación y reconocimiento','Desarrollo','Gestión de conflictos'],
  a:'Un jefe de ventas ve que el equipo no alcanza la meta. En vez de exigir más llamadas, revisa la calidad de los prospectos, acompaña visitas, identifica brechas de habilidades y acuerda compromisos medibles.',
  m:'Una jefatura amenaza con sanciones por cada error, pero nunca explica los estándares ni ofrece formación. El equipo oculta fallas, disminuye la confianza y deja de proponer mejoras.'},
 {n:'Coordinación',q:'¿Cómo articulamos?',h:'Conectar esfuerzos',d:'Sincronizar actividades, decisiones e información entre personas, áreas y aliados para que el trabajo conjunto produzca el resultado esperado. Es clave cuando un proceso cruza varias dependencias.',c:['Hitos y dependencias','Canales y frecuencia','Prioridades en conflicto','Visión del resultado completo'],
  a:'Para lanzar un producto, mercadeo confirma antes inventario, logística, servicio al cliente y soporte. Una reunión breve y una matriz de responsabilidades evitan promesas que la operación no puede cumplir.',
  m:'El área comercial ofrece una entrega en 24 horas para cerrar una venta, aunque operaciones necesita cinco días. La venta se concreta, pero aumenta el costo de urgencias y se deteriora la confianza del cliente.'},
 {n:'Control',q:'¿Qué resultados logramos?',h:'Comparar, aprender y corregir',d:'Observar el desempeño, compararlo con los objetivos y estándares, comprender las desviaciones y decidir acciones correctivas o preventivas. No es vigilar personas de forma punitiva: genera información para aprender y mejorar.',c:['Estándar o meta','Información confiable','Brechas','Causas','Acciones y responsables','Verificación'],
  a:'Un centro de servicio mide el tiempo promedio de respuesta y el porcentaje de casos resueltos en el primer contacto. Si ambos empeoran, analiza volumen, capacitación, herramientas y complejidad antes de culpar al personal.',
  m:'Se mide a los asesores solo por llamadas atendidas. Para mejorar la cifra, algunos acortan las conversaciones y transfieren casos sin resolver: el indicador sube, pero la experiencia del cliente empeora.'}];
add({t:'dark',title:'Las cinco funciones gerenciales',k:'2.1.1 Planificación, organización, dirección, coordinación y control',h:'Las cinco funciones gerenciales',
html:`<div class="row"><div id="r5"></div><div class="col fl1">
  <div class="card det" id="d5" style="min-height:330px"></div>
  <div class="segs" id="s5"><button class="seg on">Ejemplo aplicado</button><button class="seg">Ejemplo amonestador</button></div>
  <div class="card infocard" id="e5" style="min-height:130px;padding:18px 26px"></div>
</div></div>`,
init(s){let cur=0,mode=0;const nodes=[];const cx=310,cy=300,R=215;
  [-90,-18,54,126,198].forEach((a,i)=>nodes.push({x:cx+R*Math.cos(a*Math.PI/180),y:cy+R*Math.sin(a*Math.PI/180),l:FUN[i].n}));
  const rn=ring($('#r5',s),{id:5,w:620,h:600,nodes,r:72,fs:19,center:{x:cx,y:cy,r:78,t:'Ciclo gerencial'}});
  function f(){const F=FUN[cur];put($('#d5',s),`<span class="lbl" style="margin-top:0">${cur+1}. ${F.n} · ${F.q}</span><h4>${F.h}</h4><p style="font-size:23px">${F.d}</p><div class="chips st" style="margin-top:12px">${F.c.map(x=>`<span class="chip">${x}</span>`).join('')}</div>`);
    put($('#e5',s),`<p style="font-size:23px;line-height:1.4">${mode?F.m:F.a}</p>`)}
  rn.forEach((b,i)=>b.onclick=()=>{cur=i;rn.forEach(x=>x.classList.toggle('on',x===b));f()});rn[0].classList.add('on');f();
  segs($('#s5',s),i=>{mode=i;f()})},
enter(s){}});

/* ---------- 6 · CONTROL ---------- */
const CTL=['Definir el estándar o meta antes de medir.','Recolectar información confiable y comparable.','Comparar el resultado con la meta y detectar brechas.','Analizar causas, no quedarse únicamente en el síntoma.','Acordar acciones, responsables y fechas.','Verificar si la acción produjo una mejora real.'];
add({t:'light',title:'Control e indicadores',k:'Control · Regla práctica',h:'Controlar es aprender, no castigar',
html:`<div class="row">
 <div class="col" style="width:760px"><div class="col" id="c6" style="gap:8px">${CTL.map((c,i)=>`<button class="lb"><span class="n">${i+1}</span><span>${c}</span></button>`).join('')}</div>
</div>
 <div class="col fl1">
  <div class="segs" id="g6"><button class="seg on">Medir solo llamadas</button><button class="seg">Indicadores equilibrados</button></div>
  <div class="card det"><div class="bars" id="b6"></div><p id="m6" style="margin-top:16px;font-size:23px"></p><p class="mini" style="margin-top:8px">Ilustración conceptual: no son datos reales.</p></div>
  <button class="btn" id="p6" style="align-self:flex-start">▶ Recorrer el ciclo de control</button>
 </div></div>
<div class="banner card" style="margin-top:18px"><b>Regla práctica.</b> Un indicador no es el objetivo: es una señal que ayuda a entender si avanzamos. Si evalúas con una sola cifra, las personas optimizan esa cifra en lugar de mejorar el resultado real.</div>`,
init(s){const T=[];const A=[{l:'Llamadas atendidas',w:92,v:'Alta',c:''},{l:'Casos resueltos al primer contacto',w:32,v:'Baja',c:'bad'},{l:'Satisfacción del cliente',w:38,v:'Baja',c:'bad'}];
  const B=[{l:'Llamadas atendidas',w:72,v:'Buena',c:'ok'},{l:'Casos resueltos al primer contacto',w:78,v:'Buena',c:'ok'},{l:'Satisfacción del cliente',w:80,v:'Buena',c:'ok'}];
  const M=['El indicador sube, pero la experiencia del cliente empeora: los asesores acortan llamadas y transfieren casos sin resolver.','Con indicadores de cantidad, calidad y resultado, mejorar la cifra ya no premia los atajos.'];
  bars($('#b6',s),A);setTimeout(()=>setBars($('#b6',s),A),50);$('#m6',s).textContent=M[0];
  segs($('#g6',s),i=>{setBars($('#b6',s),i?B:A);$('#m6',s).textContent=M[i]});
  const items=$$('.lb',$('#c6',s));let tt=[];
  $('#p6',s).onclick=()=>{tt.forEach(clearTimeout);items.forEach(x=>x.classList.remove('on'));items.forEach((x,i)=>tt.push(setTimeout(()=>{items.forEach(y=>y.classList.remove('on'));x.classList.add('on')},i*900)))};
  items.forEach(x=>x.onclick=()=>{tt.forEach(clearTimeout);items.forEach(y=>y.classList.toggle('on',y===x))})},
enter(s){$('#g6',s).firstElementChild.click()}});

/* ---------- 7 · TRIPLE DESEMPEÑO ---------- */
const DIM={
 e:{n:'Económica',q:'¿La organización crea valor y puede sostenerse?',i:['Margen operativo','Flujo de caja','Productividad','Ventas','Costo por unidad'],r:'Pérdidas, endeudamiento insostenible o incapacidad para invertir.'},
 s:{n:'Social',q:'¿Cómo afecta a las personas y a la comunidad?',i:['Accidentalidad','Rotación','Equidad salarial','Satisfacción','Formación','Reclamaciones'],r:'Desgaste del personal, conflictos, exclusión y pérdida de confianza.'},
 a:{n:'Ambiental',q:'¿Qué impacto genera sobre recursos y ecosistemas?',i:['Consumo de agua y energía','Residuos','Emisiones','Reutilización de materiales'],r:'Costos crecientes, sanciones, impactos ambientales y daño reputacional.'}};
const EQ=['La gerencia no siempre encuentra una solución que maximice todas las dimensiones a la vez. La tarea es reconocer las tensiones, comparar alternativas y explicar las decisiones. Los empaques reutilizables pueden elevar el costo inicial pero reducir residuos y generar ahorros; automatizar aumenta la productividad, pero exige gestionar la reconversión de funciones y la capacitación.',
 'Una empresa de alimentos revisa el consumo de agua de su proceso, fija metas de reducción, capacita a sus trabajadores y mide el costo por unidad producida. La acción ambiental puede reducir costos y fortalecer la confianza de clientes y comunidades.',
 'Una compañía reduce costos descargando residuos de manera inadecuada. El ahorro inmediato oculta riesgos de sanciones, afectación a la comunidad, interrupciones operativas y pérdida de reputación.',
 '¿Una empresa puede considerarse exitosa si aumenta sus utilidades mientras deteriora la salud de sus trabajadores o contamina el entorno del que depende? ¿Qué información debería conocer la gerencia antes de decidir?'];
add({t:'dark',title:'Desempeño económico, social y ambiental',k:'2.1.2 Desempeño organizacional',h:'Desempeño sostenible: equilibrar tres dimensiones',
html:`<div class="row"><div class="v3" id="v7">
 <div class="c e"></div><div class="c s"></div><div class="c a"></div>
 <button data-k="e" style="left:140px;top:150px">Económica</button><button data-k="s" style="left:500px;top:150px">Social</button><button data-k="a" style="left:320px;top:450px">Ambiental</button><button data-k="c" class="ctr" style="left:320px;top:262px">Equilibrio</button></div>
 <div class="col fl1"><div class="card det" id="d7" style="min-height:300px"></div>
  <div class="segs" id="g7"><button class="seg on">Cómo equilibrar</button><button class="seg">Ejemplo empresarial</button><button class="seg">Ejemplo amonestador</button><button class="seg">Para debatir</button></div>
  <div class="card infocard" id="t7" style="min-height:130px;padding:18px 26px"></div></div></div>`,
init(s){let m=0;const D=k=>{const b=$$('#v7 button',s);b.forEach(x=>x.classList.toggle('on',x.dataset.k===k));$$('#v7 .c',s).forEach(c=>c.classList.toggle('dim',k!=='c'&&!c.classList.contains(k)));
  if(k==='c')put($('#d7',s),`<h4>Equilibrio</h4><p>Ninguna dimensión se analiza sola. La rentabilidad es fundamental para la continuidad, pero no describe por sí sola el impacto de las decisiones sobre trabajadores, proveedores, comunidades, consumidores y entorno natural.</p>`);
  else{const d=DIM[k];put($('#d7',s),`<span class="lbl" style="margin-top:0">Dimensión ${d.n}</span><h4>${d.q}</h4><span class="lbl">Indicadores posibles</span><div class="chips st">${d.i.map(x=>`<span class="chip">${x}</span>`).join('')}</div><span class="lbl">Riesgo si se ignora</span><p style="font-size:23px">${d.r}</p>`)}};
  $$('#v7 button',s).forEach(b=>b.onclick=()=>D(b.dataset.k));D('c');
  const T=()=>put($('#t7',s),`<p style="font-size:22px;line-height:1.4">${EQ[m]}</p>`);T();segs($('#g7',s),i=>{m=i;T()})}});

/* ---------- 8 · INDIVIDUOS Y GRUPOS ---------- */
const IG=[{f:'Objetivo',i:'Claridad sobre responsabilidades personales.',g:'Comprensión de la meta compartida y de las interdependencias.'},
 {f:'Capacidad',i:'Conocimiento, habilidades, experiencia y criterio.',g:'Complementariedad de competencias y aprendizaje colectivo.'},
 {f:'Motivación',i:'Autonomía, reconocimiento, sentido y condiciones justas.',g:'Confianza, pertenencia, seguridad psicológica y compromiso.'},
 {f:'Seguimiento',i:'Retroalimentación y metas individuales pertinentes.',g:'Indicadores compartidos, revisión de acuerdos y resolución de obstáculos.'},
 {f:'Riesgo',i:'Sobrecarga, desmotivación o metas poco realistas.',g:'Conflictos, pensamiento grupal, duplicidad o difusión de responsabilidades.'}];
const IGE=['En un equipo de proyectos, una persona entrega sus tareas a tiempo pero no comparte información crítica: su desempeño individual parece alto, mientras el resultado grupal se afecta. La gerencia debe valorar entregas, colaboración y gestión de dependencias.',
 'Una empresa premia únicamente al vendedor con más ingresos. Los empleados compiten por clientes, retienen información y ofrecen descuentos innecesarios. Una meta individual mal diseñada puede deteriorar el resultado colectivo.'];
add({t:'light',title:'Desempeño de individuos y grupos',k:'2.1.3 Desempeño humano',h:'Individuos y grupos: más que cifras de productividad',
html:`<div class="row">
 <div class="col" style="width:440px" id="l8">${IG.map((x,i)=>`<button class="lb${i?'':' on'}"><span class="n">${i+1}</span><span>${x.f}</span></button>`).join('')}</div>
 <div class="col fl1"><div class="row" style="gap:22px">
   <div class="card det fl1" id="i8" style="min-height:270px"></div><div class="card det fl1" id="g8" style="min-height:270px"></div></div>
  <div class="segs" id="s8"><button class="seg on">Ejemplo aplicado</button><button class="seg">Ejemplo amonestador</button></div>
  <div class="card infocard" id="e8" style="min-height:150px;padding:18px 26px"></div></div></div>
<div class="chips st" style="margin-top:22px;gap:12px">${['Acordar objetivos y criterios de calidad','Resultados + comportamientos','Retroalimentación frecuente y respetuosa','Reconocer sin competencia destructiva','Investigar obstáculos del sistema','Desarrollar capacidades'].map(x=>`<span class="chip">${x}</span>`).join('')}</div>`,
init(s){let m=0,c=0;const f=()=>{put($('#i8',s),`<span class="lbl" style="margin-top:0">${IG[c].f} · individual</span><p style="font-size:31px;font-weight:600">${IG[c].i}</p>`);put($('#g8',s),`<span class="lbl" style="margin-top:0">${IG[c].f} · grupal</span><p style="font-size:31px;font-weight:600">${IG[c].g}</p>`)};
  const e=()=>put($('#e8',s),`<p style="font-size:24px;line-height:1.4">${IGE[m]}</p>`);
  bindList($('#l8',s),'.lb',i=>{c=i;f()});f();e();segs($('#s8',s),i=>{m=i;e()})}});
/* ---------- 9 · MODELOS ---------- */
const MOD=[
 {k:'PE',n:'Planificación estratégica',q:'¿Hacia dónde vamos y qué decisiones priorizamos?',u:'Cambios del entorno, crecimiento, nuevos mercados, prioridades en competencia.',tipo:'Dirección y prioridades',ben:'Foco y coherencia entre objetivos y recursos',rie:'Plan desconectado de la operación',pre:'¿Qué decisiones dejaríamos de hacer para priorizar esta estrategia?'},
 {k:'CT',n:'Calidad total',q:'¿Cómo aseguramos que el cliente reciba valor de manera consistente?',u:'Errores recurrentes, variabilidad, quejas y necesidad de estandarización.',tipo:'Cultural y de procesos',ben:'Consistencia y satisfacción del cliente',rie:'Burocracia documental sin mejora real',pre:'¿Qué valora el cliente y cómo lo comprobamos?'},
 {k:'MC',n:'Mejoramiento continuo',q:'¿Qué pequeños cambios pueden mejorar el proceso de forma sostenida?',u:'Problemas repetitivos y oportunidades de optimización incremental.',tipo:'Incremental y recurrente',ben:'Aprendizaje, reducción de errores y desperdicio',rie:'Cambiar sin investigar causas',pre:'¿Qué evidencia demuestra que la mejora funcionó?'},
 {k:'RE',n:'Reingeniería',q:'¿Cómo rediseñar radicalmente un proceso que ya no sirve?',u:'Procesos lentos, costosos, fragmentados o construidos sobre supuestos obsoletos.',tipo:'Radical en procesos',ben:'Saltos importantes en tiempo, costo o servicio',rie:'Interrumpir la operación o perder controles',pre:'¿Qué pasos podemos eliminar o rediseñar desde cero?'},
 {k:'EM',n:'Empoderamiento',q:'¿Qué decisiones pueden tomar las personas más cerca del problema?',u:'Necesidad de agilidad, iniciativa, compromiso y mejor respuesta al cliente.',tipo:'Distribución de autoridad',ben:'Agilidad, iniciativa y compromiso',rie:'Responsabilidad sin recursos ni límites claros',pre:'¿Qué decisiones deben tomarse cerca del cliente?'},
 {k:'SU',n:'Subcontratación',q:'¿Qué actividades conviene contratar externamente y bajo qué controles?',u:'Servicios especializados o actividades que no constituyen la principal ventaja de la organización.',tipo:'Modelo operativo y contractual',ben:'Especialización y flexibilidad',rie:'Dependencia, pérdida de conocimiento o fallas de servicio',pre:'¿Cuál es el costo total y cómo salimos si falla?'}];
add({t:'dark',title:'Modelos gerenciales: mapa general',k:'2.2 Modelos gerenciales y su aplicabilidad',h:'Seis modelos, ninguna receta universal',
html:`<div class="row" style="align-items:center;margin-bottom:16px"><p style="font-size:24px;line-height:1.4;flex:1">Un modelo es un enfoque de pensamiento y acción que ayuda a interpretar problemas y organizar respuestas. La selección depende de:</p>
 <div class="chips st" style="width:760px">${['El reto','La cultura','La madurez de procesos','Los recursos','La urgencia','Los riesgos'].map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
<div class="fgrid" style="grid-template-columns:repeat(3,1fr);grid-auto-rows:252px" id="m9">${MOD.map((m,i)=>`<button class="flip d"><div class="in"><div class="f"><span class="ic">MODELO 0${i+1}</span><h5>${m.n}</h5><p style="font-size:21px;line-height:1.35;opacity:.9">${m.q}</p><span>Toca para ver ▸</span></div><div class="b"><p><b>Cuándo puede ser útil</b>${m.u}</p></div></div></button>`).join('')}</div>`,
init(s){$$('.flip',s).forEach(f=>f.onclick=()=>f.classList.toggle('on'))},enter(s){$$('.flip',s).forEach(f=>f.classList.remove('on'))}});

/* ---------- 10 · PLANIFICACIÓN ESTRATÉGICA ---------- */
const PEL=[['Propósito','Razón de ser, misión y valor que se quiere aportar.'],['Visión','Situación futura a la que se aspira llegar.'],['Diagnóstico','Capacidades internas, necesidades de clientes, competencia y cambios del entorno.'],['Objetivos estratégicos','Resultados prioritarios y medibles.'],['Estrategias e iniciativas','Decisiones sobre cómo competir, servir, crecer o transformarse.'],['Indicadores, metas y responsables','Cómo se sabrá si hay progreso.'],['Revisión','Aprendizaje periódico y ajustes fundamentados.']];
add({t:'dark',title:'Planificación estratégica',k:'2.2.1 Modelo · Planificación estratégica',h:'Planificación estratégica: dirigir con foco',
html:`<div class="tabs" data-tabs="p10"><button class="tab on" data-p="p10a">Elementos</button><button class="tab" data-p="p10b">Objetivo SMART</button><button class="tab" data-p="p10c">Ejemplos</button></div>
<div style="margin-top:20px">
<div class="pane on" id="p10a"><div class="row"><div class="col" style="width:600px;gap:10px" id="l10">${PEL.map((x,i)=>`<button class="lb${i?'':' on'}" style="padding:12px 16px;font-size:25px"><span class="n" style="width:38px;height:38px;font-size:19px">${i+1}</span><span>${x[0]}</span></button>`).join('')}</div>
 <div class="col fl1"><div class="card det" id="d10" style="min-height:270px"></div>
 <div class="banner card" style="font-size:22px">Debe orientar decisiones cotidianas y revisarse cuando cambian las condiciones.</div>
 <div class="chips st">${['DOFA / FODA','PESTEL','Mapa de grupos de interés','Objetivos SMART','Mapa estratégico','Cuadro de mando integral','Escenarios'].map(x=>`<span class="chip">${x}</span>`).join('')}</div>
 <p class="mini">Estas herramientas no sustituyen el juicio gerencial; lo estructuran.</p></div></div></div>
<div class="pane" id="p10b"><div class="row"><div class="col" style="width:760px;gap:12px">
 <label class="lbl" style="margin:0">Indicador</label><input class="fin" id="f1" value="el porcentaje de entregas fuera de plazo">
 <div class="row" style="gap:14px"><div class="fl1"><label class="lbl" style="margin:0 0 6px">Punto de partida (%)</label><input class="fin" id="f2" type="number" value="18"></div><div class="fl1"><label class="lbl" style="margin:0 0 6px">Resultado esperado (%)</label><input class="fin" id="f3" type="number" value="8"></div></div>
 <label class="lbl" style="margin:0">Plazo</label><input class="fin" id="f4" value="antes del cierre del segundo semestre">
 <label class="lbl" style="margin:0">Mediante…</label><input class="fin" id="f5" value="optimización de rutas y confirmación diaria de inventario"></div>
 <div class="col fl1"><div class="card det" style="min-height:230px"><span class="lbl" style="margin-top:0">Tu objetivo</span><p id="o10" style="font-size:29px;font-weight:700;line-height:1.35"></p></div>
 <div class="chips st" id="k10" style="gap:12px"></div><p class="mini">Una meta SMART tiene indicador, punto de partida, resultado esperado y plazo.</p></div></div></div>
<div class="pane" id="p10c"><div class="row"><div class="card det fl1" style="min-height:340px"><span class="lbl" style="margin-top:0">Ejemplo empresarial</span><p>Una empresa regional de distribución decide crecer en municipios intermedios. Antes de abrir nuevas rutas, analiza demanda, costos, competencia, capacidad de bodegas y servicio. Define una expansión gradual, prueba dos rutas, mide rentabilidad y cumplimiento, y escala solo cuando los resultados respaldan la decisión.</p></div>
 <div class="card det fl1" style="min-height:340px"><span class="lbl" style="margin-top:0">Ejemplo amonestador</span><p>La dirección anuncia como estrategia «ser líderes en innovación», pero no define qué significa, qué clientes prioriza ni qué recursos asignará. Las áreas lanzan proyectos desconectados y no hay forma de saber si la estrategia está funcionando.</p></div></div></div>
</div>`,
init(s){bindList($('#l10',s),'.lb',i=>put($('#d10',s),`<span class="lbl" style="margin-top:0">Elemento ${i+1} de 7</span><h4>${PEL[i][0]}</h4><p style="font-size:30px">${PEL[i][1]}</p>`));
  put($('#d10',s),`<span class="lbl" style="margin-top:0">Elemento 1 de 7</span><h4>${PEL[0][0]}</h4><p style="font-size:30px">${PEL[0][1]}</p>`);
  const u=()=>{const g=i=>$('#f'+i,s).value.trim();const ok=[g(1),g(2),g(3),g(4)].map(v=>!!v);
   $('#o10',s).textContent=(g(1)&&g(2)&&g(3)&&g(4))?`Reducir ${g(1)} del ${g(2)} % al ${g(3)} % ${g(4)}${g(5)?', mediante '+g(5):''}.`:'Completa los campos para formular tu objetivo.';
   $('#k10',s).innerHTML=['Indicador','Punto de partida','Resultado esperado','Plazo'].map((x,i)=>`<span class="chip${ok[i]?' on':''}">${ok[i]?'✓ ':''}${x}</span>`).join('')};
  $$('.fin',s).forEach(i=>i.oninput=u);u()}});

/* ---------- 11 · CALIDAD TOTAL ---------- */
const CAL=[['Orientación al cliente','Comprender necesidades expresadas y expectativas relevantes.'],['Liderazgo comprometido','La dirección modela comportamientos y asigna recursos.'],['Participación de las personas','Quienes realizan el trabajo pueden identificar y resolver problemas.'],['Gestión por procesos','Observar entradas, actividades, salidas, responsables y relaciones.'],['Decisiones basadas en evidencia','Usar datos confiables y análisis de causas.'],['Beneficio mutuo con proveedores','Relaciones de beneficio mutuo con proveedores y aliados.'],['Mejora permanente','Mejora continua de procesos, productos y servicios.']];
const CALE=['Una cadena de restaurantes define estándares de preparación, temperatura, higiene y atención; forma a los equipos; escucha comentarios de clientes; audita muestras y analiza las causas de los reclamos. El propósito no es llenar listas, sino asegurar una experiencia consistente.','Una empresa presume procedimientos documentados, pero los formatos se diligencian solo para cumplir una auditoría y no reflejan lo que sucede en la operación. La documentación existe, pero la calidad real no mejora.'];
add({t:'light',title:'Calidad total',k:'2.2.2 Modelo · Calidad total',h:'Calidad total: valor consistente, construido desde el diseño',
html:`<div class="row"><div class="col" style="width:560px;gap:8px" id="l11">${CAL.map((x,i)=>`<button class="lb" style="padding:12px 16px;font-size:25px"><span class="n" style="width:38px;height:38px;font-size:19px">${i+1}</span><span>${x[0]}</span></button>`).join('')}</div>
 <div class="col fl1"><div class="card det" id="d11" style="min-height:230px"></div>
 <div class="segs" id="g11"><button class="seg on">Ejemplo empresarial</button><button class="seg">Ejemplo amonestador</button></div>
 <div class="card infocard" id="e11" style="min-height:140px;padding:16px 24px"></div>
 <div class="chips st">${['Mapa de procesos','Listas de verificación','Pareto','Causa-efecto','Hojas de registro','Satisfacción','PHVA'].map(x=>`<span class="chip">${x}</span>`).join('')}</div></div></div>`,
init(s){let m=0;const def=()=>put($('#d11',s),`<h4>Qué es</h4><p style="font-size:24px">Filosofía de gestión que busca satisfacer de manera consistente las necesidades del cliente y de otras partes interesadas, involucrando a toda la organización en la prevención de errores. La calidad no se inspecciona solo al final: se construye desde el diseño y durante cada etapa. <b class="gold">Toca un principio.</b></p>`);
  bindList($('#l11',s),'.lb',i=>put($('#d11',s),`<span class="lbl" style="margin-top:0">Principio ${i+1}</span><h4>${CAL[i][0]}</h4><p style="font-size:30px">${CAL[i][1]}</p>`));def();
  const e=()=>put($('#e11',s),`<p style="font-size:23px;line-height:1.4">${CALE[m]}</p>`);e();segs($('#g11',s),i=>{m=i;e()})}});

/* ---------- 12 · MEJORAMIENTO CONTINUO ---------- */
const PH=[{n:'Planear',s:'Definir el problema, analizar causas, proponer un cambio y una medida.',e:'Las devoluciones aumentaron; se plantea verificar el etiquetado antes del despacho.'},
 {n:'Hacer',s:'Probar el cambio a pequeña escala.',e:'Aplicar una nueva verificación en una línea durante dos semanas.'},
 {n:'Verificar',s:'Comparar los resultados con la línea base.',e:'Medir si bajan las devoluciones y si el tiempo de despacho se mantiene.'},
 {n:'Actuar',s:'Estandarizar, ajustar o descartar con base en evidencia.',e:'Si funciona, actualizar el procedimiento y capacitar; si no, revisar la causa.'}];
const MCE=['Una oficina de servicio detecta que los usuarios repiten datos en tres formularios. El equipo mapea el proceso, prueba un formulario integrado con un grupo pequeño, mide tiempo y errores y, si la evidencia es favorable, amplía el cambio.','La gerencia implementa una aplicación para «modernizar» la operación sin probarla con usuarios ni medir errores. El cambio crea más pasos y los empleados desarrollan soluciones paralelas que aumentan el riesgo.'];
add({t:'dark',title:'Mejoramiento continuo y ciclo PHVA',k:'2.2.3 Modelo · Mejoramiento continuo',h:'Mejoramiento continuo: el ciclo PHVA',
html:`<div class="row"><div id="r12"></div><div class="col fl1">
 <div class="card det" id="d12" style="min-height:215px"></div>
 <div class="segs" id="g12"><button class="seg on">Ejemplo empresarial</button><button class="seg">Ejemplo amonestador</button></div>
 <div class="card infocard" id="e12" style="min-height:120px;padding:16px 24px"></div>
 <div class="banner card" style="font-size:22px"><b>Diferencia clave.</b> El mejoramiento continuo perfecciona el proceso existente. Si está estructuralmente roto, quizá se requiera reingeniería.</div></div></div>`,
init(s){let c=0,m=0;const cx=290,cy=290,R=205;const nodes=[[0,-1],[1,0],[0,1],[-1,0]].map((p,i)=>({x:cx+R*p[0],y:cy+R*p[1],l:PH[i].n,s:'PHVA'[i]}));
  const rn=ring($('#r12',s),{id:12,w:580,h:580,nodes,r:78,fs:24,center:{x:cx,y:cy,r:72,t:'Mejora continua'}});
  const f=()=>put($('#d12',s),`<span class="lbl" style="margin-top:0">Fase ${c+1} de 4</span><h4>${PH[c].n}</h4><p style="font-size:26px">${PH[c].s}</p><span class="lbl">Ejemplo</span><p style="font-size:23px">${PH[c].e}</p>`);
  const e=()=>put($('#e12',s),`<p style="font-size:21px;line-height:1.4">${MCE[m]}</p>`);
  rn.forEach((b,i)=>b.onclick=()=>{c=i;rn.forEach(x=>x.classList.toggle('on',x===b));f()});rn[0].classList.add('on');f();e();segs($('#g12',s),i=>{m=i;e()})}});

/* ---------- 13 · REINGENIERÍA ---------- */
const SEN=['El proceso acumula aprobaciones y transferencias que no agregan valor.','El tiempo total es inaceptable incluso cuando cada área cumple su parte.','La tecnología y las necesidades del usuario cambiaron radicalmente.','Los costos de coordinación y reproceso son altos.','Las mejoras incrementales no producen el cambio requerido.'];
add({t:'light',title:'Reingeniería',k:'2.2.4 Modelo · Reingeniería',h:'Reingeniería: repensar y rediseñar radicalmente',
html:`<div class="tabs" data-tabs="p13"><button class="tab on" data-p="p13a">¿Mejora o reingeniería?</button><button class="tab" data-p="p13b">Cómo hacerla bien</button></div>
<div style="margin-top:20px">
<div class="pane on" id="p13a"><div class="row"><div class="col" style="width:820px">
 <div class="segs" id="g13"><button class="seg on">Mejoramiento continuo</button><button class="seg">Reingeniería</button></div>
 <div class="card det" style="padding:14px 20px"><svg viewBox="0 0 760 270" width="100%" id="sv13"><line x1="30" y1="240" x2="740" y2="240" stroke="#3A3838" stroke-opacity=".4" stroke-width="2"/><line x1="30" y1="20" x2="30" y2="240" stroke="#3A3838" stroke-opacity=".4" stroke-width="2"/>
  <text x="40" y="24" font-size="17" fill="#3A3838" opacity=".7" font-family="Montserrat,sans-serif">Tiempo · costo · calidad · servicio</text>
  <path id="pa13" d="M40 225 H130 V200 H230 V175 H330 V150 H430 V125 H530 V100 H630 V75 H730" fill="none" stroke="#B8962E" stroke-width="6" stroke-linejoin="round" stroke-dasharray="1600" stroke-dashoffset="0"/>
  <path id="pb13" d="M40 225 H360 V70 H730" fill="none" stroke="#C0583B" stroke-width="6" stroke-linejoin="round" stroke-dasharray="1600" stroke-dashoffset="1600"/></svg>
  <p id="t13" style="font-size:23px;line-height:1.4;margin-top:6px"></p></div></div>
 <div class="col fl1"><span class="lbl" style="margin:0">Señales para considerar una reingeniería</span>${SEN.map(x=>`<button class="chk2">${'<span class="bx">✓</span>'}<span style="font-size:22px">${x}</span></button>`).join('')}
 <div class="meter"><i id="m13"></i></div><div class="banner card" id="v13" style="font-size:22px;padding:12px 20px"></div><span class="mini">Lectura orientativa, no un criterio formal.</span></div></div></div>
<div class="pane" id="p13b"><div class="row"><div class="col fl1"><div class="card det"><span class="lbl" style="margin-top:0">Exige</span><div class="chips st" style="gap:12px">${['Patrocinio directivo','Participación de quienes conocen el proceso','Análisis de riesgos','Pruebas','Gestión del cambio','Medición antes / después'].map(x=>`<span class="chip" style="font-size:23px">${x}</span>`).join('')}</div>
 <p style="margin-top:18px;font-size:24px"><b class="gold">«Radical» no significa improvisado</b> ni autoriza a ignorar a las personas.</p></div>
 <div class="card det"><span class="lbl" style="margin-top:0">Ejemplo empresarial</span><p style="font-size:22px">Una entidad financiera recibe solicitudes de crédito que pasan por varias áreas y repiten datos. En vez de automatizar cada paso, rediseña el flujo: captura única de datos, reglas claras, verificación paralela cuando es viable y seguimiento visible para el solicitante.</p></div></div>
 <div class="card det fl1"><span class="lbl" style="margin-top:0">Ejemplo amonestador</span><p>La organización elimina cargos y pasos de manera abrupta para reducir tiempos, pero no evalúa controles críticos ni capacita al personal. El resultado puede ser errores, sobrecarga, incumplimientos o deterioro del servicio.</p></div></div></div></div>`,
init(s){const T=['Perfecciona progresivamente el proceso existente: pequeños cambios, frecuentes y medidos.','Cuestiona por qué existen los pasos y si el proceso debe organizarse de otra forma: un salto, no una escalera.'];
  const pa=$('#pa13',s),pb=$('#pb13',s);let mode=0;
  const draw=i=>{mode=i;pa.style.transition=pb.style.transition='none';pa.style.strokeDashoffset=pb.style.strokeDashoffset=1600;void pa.getBoundingClientRect();
    const p=i?pb:pa;p.style.transition='stroke-dashoffset 1.6s ease';p.style.strokeDashoffset=0;$('#t13',s).textContent=T[i]};
  segs($('#g13',s),draw);pa.style.strokeDashoffset=0;$('#t13',s).textContent=T[0];
  const chk=$$('.chk2',s);const V=['Marca las señales que reconozcas en tu proceso.','Pocas señales: probablemente baste con mejoramiento continuo (PHVA).','Pocas señales: probablemente baste con mejoramiento continuo (PHVA).','Varias señales: evalúa seriamente una reingeniería, con patrocinio, análisis de riesgos y pruebas.','Varias señales: evalúa seriamente una reingeniería, con patrocinio, análisis de riesgos y pruebas.','Señales fuertes: el proceso probablemente necesita rediseñarse, con gestión del cambio y medición antes / después.'];
  const u=()=>{const n=chk.filter(c=>c.classList.contains('on')).length;$('#m13',s).style.width=(n/5*100)+'%';put($('#v13',s),V[n])};
  chk.forEach(c=>c.onclick=()=>{c.classList.toggle('on');u()});u()},
enter(s){$('#g13',s).firstElementChild.click()}});

/* ---------- 14 · EMPODERAMIENTO ---------- */
const EMC=['Propósito y límites de decisión explícitos','Formación técnica y acceso a información relevante','Confianza y seguridad para reportar errores o proponer cambios','Recursos y herramientas adecuados','Rendición de cuentas por decisiones y resultados','Escalamiento claro para casos que superan la autoridad delegada'];
const EME=['En un hotel, el personal de recepción puede resolver ciertos inconvenientes de huéspedes hasta un monto previamente definido, sin esperar autorización del gerente en cada caso. Esto agiliza la respuesta, siempre que existan criterios, registro y límites.','Un gerente anuncia que el equipo tiene autonomía, pero castiga cualquier decisión distinta a la que él habría tomado. La autonomía se vuelve simbólica y las personas dejan de ejercerla.'];
add({t:'dark',title:'Empoderamiento',k:'2.2.5 Modelo · Empoderamiento',h:'Empoderamiento: autonomía con responsabilidad',
html:`<div class="row"><div class="col" style="width:820px"><span class="lbl" style="margin:0">Marca las condiciones que la organización sí entrega</span><div id="c14">${EMC.map(x=>`<button class="chk2"><span class="bx">✓</span><span>${x}</span></button>`).join('')}</div></div>
 <div class="col fl1"><div class="card det" style="min-height:290px"><span class="lbl" style="margin-top:0" id="n14">0 de 6 condiciones</span><div class="meter"><i id="m14"></i></div><h4 id="h14" style="margin-top:16px"></h4><p id="p14" style="font-size:23px"></p></div>
 <div class="segs" id="g14"><button class="seg on">Ejemplo aplicado</button><button class="seg">Ejemplo amonestador</button></div>
 <div class="card infocard" id="e14" style="min-height:130px;padding:16px 24px"></div></div></div>`,
init(s){let m=0;const chk=$$('.chk2',s);const e=()=>put($('#e14',s),`<p style="font-size:21px;line-height:1.4">${EME[m]}</p>`);
  const M=[['Anunciar autonomía no basta','Las decisiones se toman lo más cerca posible del problema, pero con información, capacidades, autoridad y responsabilidades claras. Entrega las condiciones una a una.'],
   ['Autonomía frágil','Delegar responsabilidad sin entregar autoridad, recursos ni formación no es empoderamiento: es trasladar la carga del problema a quien no puede resolverlo.'],
   ['Va por buen camino','Aún faltan condiciones. Sin ellas, la autonomía puede quedarse en el discurso y las personas dejan de ejercerla.'],
   ['Condiciones completas','Las decisiones se toman cerca del problema, con límites explícitos, formación, recursos, rendición de cuentas y escalamiento claro. No significa ausencia de supervisión.']];
  const u2=()=>{const n=chk.filter(c=>c.classList.contains('on')).length;$('#n14',s).textContent=n+' de 6 condiciones';$('#m14',s).style.width=(n/6*100)+'%';const k=n===0?0:n<=3?1:n<6?2:3;$('#h14',s).textContent=M[k][0];$('#p14',s).textContent=M[k][1]};
  chk.forEach(c=>c.onclick=()=>{c.classList.toggle('on');u2()});u2();e();segs($('#g14',s),i=>{m=i;e()})}});

/* ---------- 15 · SUBCONTRATACIÓN ---------- */
const SUB=[['Importancia estratégica','¿La actividad diferencia a la organización o es un servicio de soporte?'],['Costo total','Incluir transición, supervisión, tecnología, penalidades y salida del contrato, no solo la tarifa mensual.'],['Calidad y niveles de servicio','Indicadores, tiempos, estándares y mecanismos de corrección.'],['Riesgos','Seguridad de información, protección de datos, continuidad y dependencia del proveedor.'],['Conocimiento','¿Se perderá una capacidad interna difícil de recuperar?'],['Condiciones laborales y legales','Revisar responsabilidades y cumplimiento normativo aplicable.'],['Plan de salida','Cómo recuperar el servicio o migrar a otro proveedor si el acuerdo falla.']];
add({t:'light',title:'Subcontratación',k:'2.2.6 Modelo · Subcontratación',h:'Subcontratar la actividad, no la responsabilidad',
html:`<div class="tabs" data-tabs="p15"><button class="tab on" data-p="p15a">Criterios para decidir</button><button class="tab" data-p="p15b">Costo total</button><button class="tab" data-p="p15c">Ejemplos y precaución</button></div>
<div style="margin-top:20px">
<div class="pane on" id="p15a"><div class="row"><div class="col" style="width:600px;gap:8px" id="l15">${SUB.map((x,i)=>`<button class="lb${i?'':' on'}" style="padding:12px 16px;font-size:25px"><span class="n" style="width:38px;height:38px;font-size:19px">${i+1}</span><span>${x[0]}</span></button>`).join('')}</div>
 <div class="card det fl1" id="d15" style="min-height:440px"></div></div></div>
<div class="pane" id="p15b"><div class="row"><div class="col" style="width:760px"><div class="iceb" id="ib15"><div class="blk vis">Tarifa mensual</div><div class="wl"></div>${['Transición','Supervisión','Tecnología','Penalidades','Salida del contrato'].map(x=>`<div class="blk hid" style="color:#fff;background:#4a4848">${x}</div>`).join('')}</div>
 <button class="btn" id="b15" style="align-self:flex-start;margin-top:10px">Revelar el costo total ▸</button></div>
 <div class="card det fl1" style="min-height:420px"><h4>Costo total</h4><p>Conjunto de costos directos e indirectos durante la selección, operación y terminación de una alternativa.</p><p style="margin-top:14px">Escoger al proveedor más barato mirando solo la tarifa omite costos ocultos y riesgos de dependencia.</p></div></div></div>
<div class="pane" id="p15c"><div class="row"><div class="col fl1"><div class="card det"><span class="lbl" style="margin-top:0">Ejemplo empresarial</span><p style="font-size:22px">Una empresa mediana contrata un proveedor especializado para el mantenimiento de su infraestructura tecnológica, pero conserva internamente la arquitectura, las prioridades y el gobierno de datos. Establece niveles de servicio, controles de acceso, reportes y un plan de continuidad.</p></div>
 <div class="card det"><span class="lbl" style="margin-top:0">Ejemplo amonestador</span><p style="font-size:22px">Se escoge al proveedor más barato para gestionar información sensible sin evaluar seguridad, respaldo, calidad ni capacidad de respuesta. Cuando surge un incidente, el contrato no define responsabilidades ni tiempos de recuperación.</p></div></div>
 <div class="col" style="width:520px"><div class="banner card" style="font-size:28px;font-weight:700;padding:30px 30px"><b>Precaución gerencial.</b> Subcontratar una actividad no equivale a subcontratar la responsabilidad: la organización debe gobernar el servicio, supervisar resultados y proteger a sus usuarios y datos.</div></div></div></div>
</div>`,
init(s){bindList($('#l15',s),'.lb',i=>put($('#d15',s),`<span class="lbl" style="margin-top:0">Criterio ${i+1} de 7</span><h4 style="font-size:40px">${SUB[i][0]}</h4><p style="font-size:34px;line-height:1.4">${SUB[i][1]}</p>`));
  put($('#d15',s),`<span class="lbl" style="margin-top:0">Criterio 1 de 7</span><h4 style="font-size:40px">${SUB[0][0]}</h4><p style="font-size:34px;line-height:1.4">${SUB[0][1]}</p>`);
  const ib=$('#ib15',s),b=$('#b15',s);b.onclick=()=>{ib.classList.toggle('open');b.textContent=ib.classList.contains('open')?'Ocultar ▴':'Revelar el costo total ▸'}},
enter(s){$('#ib15',s).classList.remove('open');$('#b15',s).textContent='Revelar el costo total ▸'}});

/* ---------- 16 · COMPARACIÓN ---------- */
const LENS=[['Tipo de cambio','tipo'],['Beneficio esperado','ben'],['Riesgo frecuente','rie'],['Pregunta antes de aplicarlo','pre']];
add({t:'dark',title:'Comparación práctica de los seis modelos',k:'Síntesis del Bloque 2',h:'Comparación práctica de los seis modelos',
html:`<div class="segs" id="g16">${LENS.map((l,i)=>`<button class="seg${i?'':' on'}">${l[0]}</button>`).join('')}</div>
<div class="fgrid" id="c16" style="grid-template-columns:repeat(3,1fr);grid-auto-rows:262px;margin-top:22px"></div>`,
init(s){const f=i=>{$('#c16',s).innerHTML=MOD.map((m,k)=>`<div class="card det" style="animation:pop .5s both;animation-delay:${k*70}ms;display:flex;flex-direction:column;justify-content:center"><span class="lbl" style="margin-top:0;font-size:19px">${m.n}</span><p style="font-size:${i===3?30:36}px;font-weight:700;line-height:1.3">${m[LENS[i][1]]}</p></div>`).join('')};
  f(0);segs($('#g16',s),f)}});

/* ---------- 17 · ACTIVIDAD ---------- */
const SIT=[['La empresa no tiene prioridades claras y cada área ejecuta proyectos distintos.',['PE'],'Planificación estratégica','Permite definir dirección, prioridades, metas y asignación de recursos.'],
 ['Los productos salen con defectos similares todas las semanas.',['CT','MC'],'Calidad total + mejoramiento continuo','La calidad estructura estándares y participación; PHVA ayuda a probar correcciones.'],
 ['Un trámite tarda semanas por aprobaciones duplicadas y transferencias innecesarias.',['RE'],'Reingeniería','Puede ser necesario rediseñar el flujo completo y cuestionar pasos heredados.'],
 ['Los empleados deben pedir permiso para resolver reclamos sencillos.',['EM'],'Empoderamiento','Delegar decisiones acotadas, con criterios, formación y registro.'],
 ['La organización no tiene capacidad técnica interna para una tarea especializada.',['SU'],'Subcontratación, tras análisis','Comparar capacidad, costo total, riesgos, continuidad y valor estratégico.']];
add({t:'dark',title:'Actividad: elige el modelo adecuado',k:'4. Actividad breve',h:'Actividad: elige el modelo adecuado',
html:`<div class="row" style="align-items:center;margin-bottom:16px"><div class="qprog" id="qp17"></div><span class="hint" id="sc17" style="margin-left:auto;font-size:24px;font-weight:700;opacity:1">Aciertos: 0</span></div>
<div class="card sit" id="s17"></div>
<div class="qopts" id="o17" style="margin-top:18px">${MOD.map(m=>`<button class="qopt" data-k="${m.k}">${m.n}</button>`).join('')}</div>
<div class="card infocard" id="f17" style="min-height:170px;margin-top:20px;padding:20px 28px"></div>
<div class="row" style="margin-top:12px"><button class="btn fill" id="n17" style="display:none">Siguiente ▸</button></div>`,
init(s){let i=0,ok=0,ans=false;const prog=$('#qp17',s);
  const show=()=>{ans=false;$('#s17',s).textContent=SIT[i][0];pop($('#s17',s));$$('.qopt',s).forEach(b=>{b.disabled=false;b.className='qopt'});
    prog.innerHTML=SIT.map((x,k)=>`<i class="${k<i?'done':k===i?'on':''}"></i>`).join('');put($('#f17',s),'<p style="font-size:26px;opacity:.8">Elige el modelo que mejor ayudaría. En algunos casos más de uno puede servir.</p>');$('#n17',s).style.display='none';$('#sc17',s).textContent='Aciertos: '+ok};
  $$('.qopt',s).forEach(b=>b.onclick=()=>{if(ans)return;ans=true;const good=SIT[i][1].includes(b.dataset.k);if(good)ok++;
    $$('.qopt',s).forEach(x=>{x.disabled=true;if(SIT[i][1].includes(x.dataset.k))x.classList.add('ok')});if(!good)b.classList.add('no');
    put($('#f17',s),`<h4 style="font-size:32px;color:${good?'#9fe0b3':'var(--gold)'}">${good?'¡Correcto!':'Casi: lo esperado es'} ${SIT[i][2]}</h4><p style="font-size:27px">${SIT[i][3]}</p>`);
    $('#sc17',s).textContent='Aciertos: '+ok;const n=$('#n17',s);n.style.display='inline-flex';n.textContent=i===SIT.length-1?'Ver resultado ▸':'Siguiente ▸'});
  let fin=false;
  $('#n17',s).onclick=()=>{if(fin){fin=false;i=0;ok=0;show();return}
    if(i===SIT.length-1){fin=true;$('#s17',s).textContent=`Resultado: ${ok} de ${SIT.length}. Recuerda: los modelos son herramientas, no recetas universales.`;prog.innerHTML=SIT.map(()=>'<i class="done"></i>').join('');$('#n17',s).textContent='Reiniciar ↺';$$('.qopt',s).forEach(b=>b.disabled=true);return}
    i++;show()};
  s._reset=()=>{fin=false;i=0;ok=0;show()};show()},
enter(s){s._reset()}});

/* ---------- 18 · CASO ---------- */
const CASE=[['Entregas fuera de plazo',18,8,'%'],['Pedidos con devolución',7,4,'%'],['Quejas por cada 100 pedidos',12,6,''],['Tiempo promedio de respuesta a una queja',48,24,' h']];
const PQ=['¿Qué problemas corresponden a planificación, organización, dirección, coordinación y control?','¿Qué información adicional solicitarían antes de cambiar procesos o contratar un proveedor?','¿Qué indicadores deben analizarse juntos para evitar que una mejora local perjudique al cliente?','¿Qué acciones serían mejoras incrementales y qué señales justificarían una reingeniería?','¿Qué decisiones podría tomar directamente el personal de atención y bodega? ¿Cuáles deben escalarse?','¿Qué criterios usarían para decidir si se subcontratan algunas rutas?','¿Cómo considerarían el desempeño económico, social y ambiental de las alternativas?'];
add({t:'light',title:'Caso integrador: Distribuciones Horizonte',k:'3. Caso integrador para trabajo en equipos',h:'Caso: Distribuciones Horizonte',
html:`<div class="tabs" data-tabs="p18"><button class="tab on" data-p="p18a">El caso y los datos</button><button class="tab" data-p="p18b">Preguntas de análisis</button><button class="tab" data-p="p18c">Producto del equipo</button></div>
<div style="margin-top:20px">
<div class="pane on" id="p18a"><div class="row"><div class="col" style="width:700px"><div class="card det"><p style="font-size:23px">Empresa ficticia colombiana que abastece tiendas y restaurantes en varias ciudades. En el último año <b>aumentaron las ventas</b>, pero también las <b>entregas tardías, las devoluciones y las quejas</b>.</p>
 <div class="chips st" style="margin-top:12px">${['Comercial promete plazos que operaciones no cumple','Bodega y ventas usan registros distintos','Reportes con varios días de retraso','Piden autorización hasta para lo sencillo','Evalúan un operador logístico externo'].map(x=>`<span class="chip" style="font-size:20px">${x}</span>`).join('')}</div></div>
 <p class="mini">Datos simulados para fines académicos.</p></div>
 <div class="col fl1"><div class="segs" id="g18"><button class="seg on">Situación actual</button><button class="seg">Meta inicial propuesta</button></div>
 <div class="card det"><div class="bars" id="b18"></div><p style="margin-top:14px;font-size:21px"><b>Consumo de combustible por entrega:</b> línea base por establecer · meta: reducir 5 % sin afectar el servicio.</p></div></div></div></div>
<div class="pane" id="p18b"><div class="qlist" style="grid-template-columns:repeat(7,1fr)" id="ql18">${PQ.map((q,i)=>`<button${i?'':' class="on"'}>${i+1}</button>`).join('')}</div><div class="card bigq" id="bq18" style="margin-top:20px;font-size:38px"></div></div>
<div class="pane" id="p18c"><div class="card det"><span class="lbl" style="margin-top:0">El equipo entrega</span>${['Un diagnóstico breve que separe síntomas y causas probables.','Tres acciones priorizadas, cada una con responsable, plazo e indicador.','Una decisión argumentada sobre el modelo gerencial más útil y sus riesgos.','Una medida para proteger la calidad del servicio y otra para vigilar el impacto social o ambiental.'].map(x=>`<button class="chk2"><span class="bx">✓</span><span style="font-size:27px">${x}</span></button>`).join('')}</div></div>
</div>`,
init(s){const mk=m=>CASE.map(r=>({l:r[0],w:m?r[2]/r[1]*100:100,v:(m?r[2]:r[1])+r[3],c:m?'ok':'bad'}));
  bars($('#b18',s),mk(0));setBars($('#b18',s),mk(0));segs($('#g18',s),i=>setBars($('#b18',s),mk(i)));
  const q=bindList($('#ql18',s),'button',i=>put($('#bq18',s),`<span>${PQ[i]}</span>`));put($('#bq18',s),`<span>${PQ[0]}</span>`);
  $$('#p18c .chk2',s).forEach(c=>c.onclick=()=>c.classList.toggle('on'))}});

/* ---------- 19 · ERRORES ---------- */
const ERR=[['Confundir actividad con resultado','Se reportan reuniones, llamadas o documentos, pero no el efecto conseguido.','Definir indicadores de resultado y de calidad, además de actividades.'],
 ['Medir una sola dimensión','Se privilegia costo o velocidad y se ignoran efectos en clientes y trabajadores.','Usar un conjunto equilibrado de indicadores.'],
 ['Copiar modelos de otras empresas','Se asume que una práctica exitosa funcionará igual en cualquier contexto.','Adaptar el enfoque a estrategia, tamaño, cultura y capacidad.'],
 ['Cambiar sin escuchar a quienes ejecutan','Se diseña desde la oficina sin comprender el trabajo real.','Involucrar a usuarios, trabajadores y responsables de proceso.'],
 ['Delegar sin autoridad','Se asignan metas, pero no recursos ni capacidad de decisión.','Definir límites, recursos, competencias y escalamiento.'],
 ['Subcontratar solo por precio','Se omiten costos ocultos y riesgos de dependencia.','Evaluar costo total, calidad, seguridad y plan de salida.'],
 ['Convertir el control en castigo','Se ocultan errores y se pierde aprendizaje.','Usar datos para analizar causas y establecer acciones correctivas.']];
add({t:'light',title:'Errores gerenciales frecuentes',k:'5. Errores frecuentes',h:'Errores gerenciales frecuentes y cómo prevenirlos',
html:`<div class="fgrid" id="g19" style="grid-template-columns:repeat(4,1fr);grid-auto-rows:300px">${ERR.map((e,i)=>`<button class="flip"><div class="in"><div class="f"><span class="ic">ERROR ${String(i+1).padStart(2,'0')}</span><h5>${e[0]}</h5><span>Toca para ver ▸</span></div><div class="b"><p><b>Por qué ocurre</b>${e[1]}</p><p><b>Prevención</b>${e[2]}</p></div></div></button>`).join('')}
 <div class="card det" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><h4 style="font-size:28px">¿Cuál has visto tú?</h4><p style="font-size:22px">Comparte un caso de tu experiencia.</p></div></div>`,
init(s){$$('.flip',s).forEach(f=>f.onclick=()=>f.classList.toggle('on'))},enter(s){$$('.flip',s).forEach(f=>f.classList.remove('on'))}});

/* ---------- 20 · GUÍA RÁPIDA ---------- */
const GQ=['¿Cuál es el problema concreto y qué evidencia demuestra que existe?','¿A quién afecta y qué resultado necesita cambiar?','¿Qué causas explican la situación y cuáles son solo síntomas?','¿Qué alternativas existen, incluyendo no hacer nada por ahora?','¿Qué efectos económicos, sociales y ambientales tendría cada alternativa?','¿Qué personas, capacidades, recursos y alianzas se requieren?','¿Qué riesgos, obligaciones y efectos no deseados deben prevenirse?','¿Cómo se medirá el resultado, quién responderá y cuándo se revisará?','¿Qué se aprenderá si la solución no produce el efecto esperado?'];
add({t:'dark',title:'Guía rápida para analizar una decisión',k:'6. Guía rápida',h:'Nueve preguntas antes de recomendar una solución',
html:`<div class="tiles" id="t20" style="grid-auto-rows:170px">${GQ.map((q,i)=>`<button class="tile"><span class="n">${i+1}</span><span>${q}</span></button>`).join('')}</div>
<div class="row" style="margin-top:22px;align-items:center"><div class="meter fl1"><i id="m20"></i></div><span class="hint" id="p20" style="font-size:24px;font-weight:700;opacity:1;min-width:360px">0 de 9 preguntas recorridas</span></div>`,
init(s){const t=$$('.tile',s);const u=()=>{const n=t.filter(x=>x.classList.contains('on')).length;$('#m20',s).style.width=(n/9*100)+'%';$('#p20',s).textContent=n===9?'Decisión analizada con criterio ✓':n+' de 9 preguntas recorridas'};
  t.forEach(x=>x.onclick=()=>{x.classList.toggle('on');u()})}});

/* ---------- 21 · DEBATE ---------- */
const DQ=['¿Por qué la planificación no garantiza el éxito, pero sí puede reducir la improvisación?','¿Puede una empresa ser rentable y, al mismo tiempo, tener un desempeño social o ambiental deficiente? ¿Cómo debería responder la gerencia?','¿Qué diferencia existe entre controlar un proceso y controlar de forma excesiva a las personas?','¿Cuándo conviene mejorar un proceso paso a paso y cuándo rediseñarlo radicalmente?','¿Qué debe entregar una organización antes de exigir autonomía a sus colaboradores?','¿Qué actividades nunca deberían subcontratarse sin controles rigurosos y por qué?','¿Qué modelo gerencial sería más útil en una pequeña empresa familiar que está creciendo rápidamente?','¿Qué indicador podría generar comportamientos indeseados si se usa de manera aislada?'];
add({t:'light',title:'Preguntas para discusión',k:'8. Evaluación formativa',h:'Ruleta de preguntas para discutir',
html:`<div class="card bigq" id="bq21" style="min-height:360px"></div>
<div class="row" style="margin:18px 0;align-items:center"><button class="btn fill" id="sp21">🎲 Sortear pregunta</button><span class="mini" style="font-size:20px">O elige una por número:</span></div>
<div class="qlist" id="ql21">${DQ.map((q,i)=>`<button>${i+1}</button>`).join('')}</div>`,
init(s){const bq=$('#bq21',s),btns=$$('#ql21 button',s);let last=-1;
  const set=i=>{last=i;btns.forEach((b,k)=>b.classList.toggle('on',k===i));bq.classList.remove('spin');put(bq,`<span style="font-size:${DQ[i].length>110?36:42}px">${DQ[i]}</span>`)};
  btns.forEach((b,i)=>b.onclick=()=>set(i));
  $('#sp21',s).onclick=()=>{let n=0;const tmr=setInterval(()=>{bq.classList.add('spin');bq.firstChild&&(bq.innerHTML=`<span style="font-size:42px">${DQ[Math.floor(Math.random()*DQ.length)]}</span>`);n++;if(n>9){clearInterval(tmr);let k;do{k=Math.floor(Math.random()*DQ.length)}while(k===last);set(k)}},110)};
  bq.innerHTML='<span style="font-size:40px;opacity:.7">Pulsa «Sortear pregunta» para empezar el debate</span>'}});

/* ---------- 22 · GLOSARIO ---------- */
const GLO=[['Administración gerencial','Proceso de definir objetivos, organizar recursos, orientar personas y evaluar resultados.'],['Indicador','Medida que ofrece información sobre una actividad, proceso o resultado.'],['Línea base','Valor inicial con el que se compara el avance.'],['Meta','Resultado específico que se espera alcanzar en un plazo.'],['Proceso','Conjunto relacionado de actividades que transforma entradas en resultados.'],['Parte interesada','Persona o grupo que puede afectar o verse afectado por la organización.'],['Calidad total','Enfoque organizacional para crear valor consistente y mejorar con participación de todos.'],['Mejoramiento continuo','Práctica sistemática de probar y sostener mejoras progresivas.'],['Reingeniería','Rediseño fundamental y radical de procesos para obtener mejoras significativas.'],['Empoderamiento','Delegación de autoridad y autonomía acompañada de información, capacidades y responsabilidad.'],['Subcontratación','Contratación de un proveedor externo para prestar una actividad o servicio.'],['Costo total','Conjunto de costos directos e indirectos durante la selección, operación y terminación de una alternativa.']];
add({t:'light',title:'Glosario básico',k:'7. Glosario',h:'Glosario básico',
html:`<input class="sin" id="q22" placeholder="Busca un término…" autocomplete="off"><div class="gl" id="gl22">${GLO.map(g=>`<div class="gt"><h6>${g[0]}</h6><p>${g[1]}</p></div>`).join('')}</div>`,
init(s){const q=$('#q22',s);q.oninput=()=>{const v=q.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');$$('.gt',s).forEach(g=>{const t=g.textContent.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');g.classList.toggle('hide',!t.includes(v))})}}});

/* ---------- 23 · CIERRE ---------- */
const REFS=['Deming, W. E. (1986). <i>Out of the crisis</i>. MIT Press.','Drucker, P. F. (2007). <i>The practice of management</i>. HarperBusiness. (Obra original publicada en 1954).','Hammer, M., & Champy, J. (1993). <i>Reengineering the corporation: A manifesto for business revolution</i>. HarperBusiness.','Kaplan, R. S., & Norton, D. P. (1996). <i>The balanced scorecard: Translating strategy into action</i>. Harvard Business School Press.','Kotter, J. P. (1996). <i>Leading change</i>. Harvard Business School Press.','Porter, M. E. (1985). <i>Competitive advantage: Creating and sustaining superior performance</i>. Free Press.','International Organization for Standardization. (2015). <i>ISO 9001:2015 Quality management systems—Requirements</i>. ISO.','International Organization for Standardization. (2015). <i>ISO 14001:2015 Environmental management systems—Requirements with guidance for use</i>. ISO.','Elkington, J. (1997). <i>Cannibals with forks: The triple bottom line of 21st century business</i>. Capstone.'];
add({t:'photo',cls:'s10',title:'Conclusiones y referencias',raw:`
<div class="bgimg"></div><div class="ov"></div>
<img class="logo edu-tr" src="${IMG.eduW}" alt=""><img class="logo ibero-bl" src="${IMG.ibW}" alt=""><div class="deco"></div>
<div class="ttl"><div class="kicker rv">9. Conclusiones para cerrar</div><h2 class="rv" style="--d:1">Funciones articuladas, modelos con criterio</h2></div>
<div class="area rv" style="--d:2"><div class="row">
 <div class="card det fl1" style="min-height:0"><span class="lbl" style="margin-top:0">Cinco funciones, un sistema</span><div class="chips st" style="gap:10px">${['Planificar da dirección','Organizar distribuye responsabilidades','Dirigir moviliza capacidades','Coordinar conecta esfuerzos','Controlar permite aprender y corregir'].map(x=>`<span class="chip" style="font-size:22px">${x}</span>`).join('')}</div><p style="margin-top:16px;font-size:23px">Ninguna función opera aislada: la fortaleza surge de su articulación.</p></div>
 <div class="card det fl1" style="min-height:0"><span class="lbl" style="margin-top:0">Seis modelos, ninguna receta</span><div class="chips st" style="gap:10px">${['Planificación estratégica: priorizar','Calidad total: valor consistente','Mejoramiento continuo: aprender','Reingeniería: replantear procesos','Empoderamiento: decisiones cerca del trabajo','Subcontratación: especialización gobernada'].map(x=>`<span class="chip" style="font-size:22px">${x}</span>`).join('')}</div><p style="margin-top:16px;font-size:23px">Son herramientas, no recetas universales.</p></div></div>
 <div class="banner card" style="margin-top:14px;font-size:25px;font-weight:700;line-height:1.35"><b>Mensaje final.</b> Una buena gerencia no se mide solo por cuánto produce, sino por la manera en que logra resultados, desarrolla a las personas, responde a sus clientes y cuida la sostenibilidad de la organización.</div></div>
