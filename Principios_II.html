html,body{width:100%;height:100%;overflow:hidden;background:#161515;font-family:'Montserrat','Poppins','Segoe UI',Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
#vp{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;background:var(--ch2)}
#fx{position:absolute;inset:0;z-index:0;pointer-events:none;transition:opacity .6s}
#stage[data-theme="light"] #fx{opacity:0}

/* ===== slides ===== */
.slide{position:absolute;inset:0;z-index:1;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s;overflow:hidden}
.slide.active{opacity:1;visibility:visible}
.slide.dark{background:linear-gradient(135deg,#585656 0%,#454343 45%,#363434 100%)}
.slide.light{background:#fff;color:var(--ink);
  background-image:radial-gradient(circle at 1px 1px,rgba(184,150,46,.13) 1px,transparent 0);background-size:34px 34px}
.slide .bgimg{position:absolute;inset:0;background-image:var(--bgimg);background-size:cover;background-position:center}
.slide .ov{position:absolute;inset:0;background:linear-gradient(100deg,rgba(24,23,23,.86) 0%,rgba(30,29,29,.66) 55%,rgba(30,29,29,.5) 100%)}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.slide.active .rv{opacity:1;transform:none;transition-delay:calc(var(--d,0) * 110ms + 250ms)}

/* logos */
.logo{position:absolute;z-index:5}
.logo.ibero-bl{left:70px;bottom:44px;width:230px}
.logo.ibero-tr{right:70px;top:46px;width:270px}
.logo.edu-tl{left:70px;top:44px;width:230px}
.logo.edu-tr{right:70px;top:44px;width:230px}
.logo.edu-br{right:70px;bottom:50px;width:300px}

/* titles */
.kicker{font-size:22px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#fff;opacity:.85}
.light .kicker{color:var(--ink)}
.ttl{position:absolute;left:110px;top:112px;right:110px;z-index:4}
.ttl h2{font-size:56px;line-height:1.1;font-weight:700;color:var(--gold);margin-top:10px;letter-spacing:-.01em}
.light .ttl h2{color:var(--gold-d)}
.ttl p.lead{font-size:26px;line-height:1.4;margin-top:12px;max-width:1500px;opacity:.92;font-weight:400}
.deco{position:absolute;left:0;top:152px;width:84px;height:1px;background:var(--gold);z-index:4}
.deco::after{content:"";position:absolute;right:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#E4CA5E 50%,#C39A3A 50%)}
.frame{position:absolute;pointer-events:none;z-index:2}
.frame.tl{border-left:2px solid var(--gold);border-top:2px solid var(--gold)}
.frame.br{border-right:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.frame{filter:drop-shadow(0 0 6px rgba(219,191,78,.6))}

/* generic */
.card{background:rgba(255,255,255,.075);border:1px solid rgba(219,191,78,.38);border-radius:16px;backdrop-filter:blur(2px)}
.light .card{background:#F8F5EA;border-color:rgba(184,150,46,.5)}
.btn{display:inline-flex;align-items:center;gap:12px;border:2px solid var(--gold);background:transparent;color:var(--gold);font-weight:700;font-size:24px;padding:14px 32px;border-radius:50px;transition:all .25s}
.btn:hover{background:var(--gold);color:#2a2929;transform:translateY(-2px)}
.btn.fill{background:var(--gold);color:#2a2929}
.btn.fill:hover{background:var(--gold-l)}
.chip{display:inline-flex;align-items:center;border:1.5px solid rgba(219,191,78,.7);color:inherit;background:transparent;border-radius:40px;padding:8px 20px;font-size:22px;font-weight:500;transition:all .2s}
.chip.on{background:var(--gold);color:#262525;border-color:var(--gold);font-weight:700}
.chip:hover{border-color:var(--gold);transform:translateY(-1px)}
.gold{color:var(--gold)}
.light .gold{color:var(--gold-d)}
.hint{font-size:20px;letter-spacing:.06em;opacity:.8;display:flex;align-items:center;gap:10px}
.hint i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(219,191,78,.7)}70%{box-shadow:0 0 0 14px rgba(219,191,78,0)}100%{box-shadow:0 0 0 0 rgba(219,191,78,0)}}
.pop{animation:pop .5s ease}
@keyframes pop{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
.tabs{display:flex;gap:14px}
.tab{padding:12px 30px;border:2px solid var(--gold);background:transparent;border-radius:50px;font-weight:600;font-size:23px;color:inherit;transition:all .25s}
.light .tab{border-color:var(--gold-d)}
.tab.on{background:var(--gold);color:#262525;border-color:var(--gold)}
.pane{display:none}.pane.on{display:block;animation:pop .55s ease}

/* ===== slide 1 cover ===== */
.cover .ov{background:linear-gradient(90deg,rgba(18,17,17,.45) 0%,rgba(18,17,17,.2) 60%,rgba(18,17,17,.05) 100%)}
.cover .body{position:absolute;left:290px;top:290px;width:1330px;z-index:4}
.cover h1{font-size:72px;line-height:1.08;font-weight:800;color:var(--gold);letter-spacing:-.02em;margin:18px 0 26px}
.cover h1 .strike{position:relative;color:#fff;font-weight:700;white-space:nowrap}
.cover h1 .strike::after{content:"";position:absolute;left:-4px;right:-4px;top:54%;height:7px;background:var(--coral);border-radius:4px;transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.7,0,.2,1) 1.6s}
.slide.active.cover h1 .strike::after{transform:scaleX(1)}
.cover h1 .glow{color:var(--gold);text-shadow:0 0 28px rgba(219,191,78,.55)}
.cover .sub{font-size:28px;line-height:1.45;max-width:1000px;opacity:.95;font-weight:400}
.cover .by{margin-top:36px;font-size:22px;line-height:1.5;opacity:.85;border-left:3px solid var(--gold);padding-left:18px}
.cover .by b{color:var(--gold);font-weight:700}
.cover .go{margin-top:40px}
.cover .keys{position:absolute;left:70px;bottom:58px;font-size:18px;letter-spacing:.06em;opacity:.7;z-index:4}


/* ===== story slides ===== */
.story .stage-row{position:absolute;left:110px;right:110px;top:312px;display:flex;gap:50px;align-items:flex-start;z-index:4}
.story .stage-row.rev{flex-direction:row-reverse}
.imgwrap{position:relative;width:1030px;flex:none;border-radius:6px;overflow:visible;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.imgwrap img{display:block;width:100%;border-radius:6px}
.imgwrap::before,.imgwrap::after{content:"";position:absolute;width:90px;height:90px;pointer-events:none;filter:drop-shadow(0 0 6px rgba(219,191,78,.6))}
.imgwrap::before{left:-16px;top:-16px;border-left:2px solid var(--gold);border-top:2px solid var(--gold)}
.imgwrap::after{right:-16px;bottom:-16px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.hs{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #fff;background:rgba(219,191,78,.92);color:#262525;font-weight:800;font-size:26px;display:grid;place-items:center;animation:pulse 2s infinite;transition:transform .2s;z-index:3}
.hs:hover{transform:scale(1.18)}
.hs.on{background:#fff;border-color:var(--gold);animation:none;box-shadow:0 0 0 6px rgba(219,191,78,.55)}
.hs.seen{animation:none;background:rgba(219,191,78,.7)}
.infocard{padding:28px 32px;min-height:236px}
.infocard h4{font-size:30px;color:var(--gold);line-height:1.2;margin-bottom:12px;font-weight:700}
.infocard p{font-size:25px;line-height:1.45;opacity:.96}
.side{width:620px;flex:none;display:flex;flex-direction:column;gap:22px}
.side .tags{display:flex;gap:10px;flex-wrap:wrap}
.tagk{border-radius:8px;background:rgba(219,191,78,.16);border:1px solid rgba(219,191,78,.5);padding:8px 14px;font-size:20px;font-weight:600}
.caption{font-size:19px;opacity:.65;margin-top:12px;font-style:italic}

/* slide 2 poster */
.poster-wrap{position:relative;width:470px;flex:none;box-shadow:0 22px 60px rgba(0,0,0,.55);border-radius:6px;transform:rotate(-1.6deg);transition:transform .4s}
.poster-wrap:hover{transform:rotate(0) scale(1.015)}
.poster-wrap img{display:block;width:100%;border-radius:6px}
.poster-wrap::before{content:"";position:absolute;left:-18px;top:-18px;width:90px;height:90px;border-left:2px solid var(--gold);border-top:2px solid var(--gold);filter:drop-shadow(0 0 6px rgba(219,191,78,.6))}
.poster-wrap::after{content:"";position:absolute;right:-18px;bottom:-18px;width:90px;height:90px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);filter:drop-shadow(0 0 6px rgba(219,191,78,.6))}
.s2 .stage-row{top:214px;gap:90px}
.s2 .right{flex:1;padding-top:6px}
.s2 .film{font-size:22px;letter-spacing:.2em;opacity:.8}
.s2 h2{font-size:56px;line-height:1.1;color:var(--gold);font-weight:800;margin:10px 0 20px}
.steps{list-style:none;display:flex;flex-direction:column;gap:14px;min-height:330px}
.steps li{display:flex;gap:18px;align-items:flex-start;font-size:26px;line-height:1.42;opacity:0;transform:translateX(30px);transition:all .6s;max-height:0;overflow:hidden}
.steps li.show{opacity:1;transform:none;max-height:140px}
.steps li b.n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gold);color:#262525;display:grid;place-items:center;font-size:22px;margin-top:2px}
.steps li.strong{color:var(--gold);font-weight:700}
.s2 .poster-wrap .hs{width:40px;height:40px;margin:-20px 0 0 -20px;font-size:22px}
.s2 .pcard{margin-top:6px;padding:18px 24px;min-height:128px}
.s2 .pcard h4{font-size:24px;color:var(--gold);margin-bottom:4px}
.s2 .pcard p{font-size:21px;line-height:1.4}

/* slide 4 votes */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:16px;text-align:left;border:2px solid rgba(219,191,78,.55);background:rgba(255,255,255,.06);border-radius:14px;padding:14px 20px;font-size:24px;font-weight:600;line-height:1.25;transition:all .25s;position:relative;overflow:hidden}
.opt:hover{border-color:var(--gold);transform:translateX(4px)}
.opt .k{flex:none;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#262525;display:grid;place-items:center;font-weight:800;font-size:22px}
.opt .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--gold);width:0;transition:width .6s}
.opt .v{margin-left:auto;font-size:22px;color:var(--gold);font-weight:800;min-width:30px;text-align:right}
.opt.sel{background:rgba(219,191,78,.18);border-color:var(--gold)}
.opt.best.sel{background:rgba(219,191,78,.32);box-shadow:0 0 28px rgba(219,191,78,.45)}
.fb{padding:20px 26px;min-height:150px}
.fb h4{font-size:26px;color:var(--gold);margin-bottom:6px}
.fb p{font-size:23px;line-height:1.42}

/* slide 5 timeline */
.tl{list-style:none;position:relative;padding-left:6px}
.tl::before{content:"";position:absolute;left:25px;top:16px;bottom:16px;width:3px;background:rgba(255,255,255,.2)}
.tl li{position:relative;display:flex;gap:18px;align-items:flex-start;padding:10px 0;opacity:.35;transition:all .6s;font-size:24px;line-height:1.35}
.tl li .dot{flex:none;width:40px;height:40px;border-radius:50%;background:#4a4848;border:3px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:800;font-size:20px;z-index:1;transition:all .5s}
.tl li.lit{opacity:1}
.tl li.lit .dot{background:var(--gold);border-color:var(--gold);color:#262525;box-shadow:0 0 20px rgba(219,191,78,.7)}
.tl li b{color:var(--gold)}
.lesson{position:absolute;left:110px;right:110px;bottom:136px;z-index:4;padding:20px 34px;display:flex;align-items:center;gap:28px;border-left:6px solid var(--gold)}
.lesson strong{font-size:30px;line-height:1.3;font-weight:700}
.lesson strong em{font-style:normal;color:var(--gold)}
.s5 .stage-row{top:262px}
.s5 .imgwrap{width:960px}.s5 .side{width:690px}

/* ===== slide 6 (light) ===== */
.s6 .grid{position:absolute;left:110px;right:110px;top:292px;display:flex;gap:44px;z-index:4}
.stats{width:560px;display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:none}
.stat{background:linear-gradient(135deg,#4a4848,#333131);color:#fff;border-radius:16px;padding:24px 22px;height:262px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:linear-gradient(180deg,rgba(228,202,94,.9) 50%,rgba(195,154,58,.9) 50%);opacity:.9}
.stat .num{font-size:84px;font-weight:800;line-height:1;color:var(--gold);letter-spacing:-.03em}
.stat .num small{font-size:40px;font-weight:700}
.stat .lb{font-size:22px;line-height:1.35;font-weight:500}
.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1}
.flip{perspective:1000px;height:262px;border:0;background:none;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:20px 20px;display:flex;flex-direction:column;justify-content:space-between}
.flip .f{background:#F8F5EA;border:1.5px solid var(--gold-d);color:var(--ink)}
.flip .f .ic{font-size:20px;font-weight:800;color:var(--gold-d);letter-spacing:.1em}
.flip .f h5{font-size:26px;line-height:1.2;font-weight:700}
.flip .f span{font-size:18px;opacity:.7;font-weight:600}
.flip .b{background:var(--gold);color:#262525;transform:rotateY(180deg);justify-content:flex-start;gap:8px}
.flip .b p{font-size:20px;line-height:1.35;font-weight:500}
.flip .b p b{display:block;font-size:16px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.75}
.s6 .src{position:absolute;left:110px;bottom:176px;font-size:18px;opacity:.7;z-index:4}
.s6 .takeaway{position:absolute;right:110px;bottom:160px;z-index:4;font-size:28px;font-weight:700;color:var(--ink);max-width:1060px;text-align:right}
.s6 .takeaway em{font-style:normal;color:var(--gold-d)}

/* ===== slide 7 ===== */
.s7 .tabs{position:absolute;left:110px;top:298px;z-index:6}
.s7 .panes{position:absolute;left:110px;right:110px;top:384px;z-index:4}
.seg{padding:12px 26px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);font-weight:700;font-size:22px;border-radius:12px;transition:all .25s}
.seg.on{background:var(--gold);border-color:var(--gold);color:#262525}
.modebar{display:flex;gap:12px;margin-bottom:22px}
.doorsrow{display:flex;gap:40px;align-items:center}
.origin{width:560px;flex:none;padding:30px 32px;min-height:350px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.origin small{font-size:18px;letter-spacing:.2em;opacity:.8;font-weight:700}
.origin b{font-size:38px;line-height:1.2;color:var(--gold);font-weight:800}
.origin ul{list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.origin li{background:rgba(219,191,78,.2);border:1px solid var(--gold);border-radius:30px;padding:6px 16px;font-size:21px;font-weight:600;animation:pop .5s both}
.arrow{font-size:56px;color:var(--gold);flex:none}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1}
.door{border:1.5px dashed rgba(255,255,255,.3);border-radius:14px;padding:16px 16px;min-height:104px;font-size:22px;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:12px;opacity:.28;transition:all .5s;transition-delay:var(--dd,0ms)}
.door svg{flex:none;width:30px;height:30px}
.doors.cap .door,.doors .door.always{opacity:1;border:1.5px solid var(--gold);background:rgba(219,191,78,.12)}
.doors.cap .door svg{display:none}
.doors.cap .door::before{content:'✓';color:var(--gold);font-weight:800;font-size:28px;flex:none;width:30px;text-align:center}
.doors.cap .door.future::before{color:#262525}
.doors.cap .door.future{background:var(--gold);color:#262525;box-shadow:0 0 28px rgba(219,191,78,.5)}
.msg7{margin-top:22px;font-size:27px;line-height:1.4;font-weight:600;max-width:1500px}
.msg7 em{color:var(--gold);font-style:normal}
.loop{display:flex;gap:56px;align-items:center}
.ring{position:relative;width:640px;height:520px;flex:none}
.ring .core{position:absolute;left:50%;top:300px;transform:translate(-50%,-50%);width:150px;height:150px;padding:10px;border-radius:50%;background:radial-gradient(circle,rgba(219,191,78,.3),rgba(219,191,78,.05));border:2px solid var(--gold);display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px;line-height:1.2;color:var(--gold);animation:spin-glow 4s infinite}
@keyframes spin-glow{50%{box-shadow:0 0 40px rgba(219,191,78,.5)}}
.node{position:absolute;width:190px;height:190px;margin:-95px 0 0 -95px;padding:10px;border-radius:50%;border:3px solid var(--gold);background:#434141;display:grid;place-items:center;font-weight:800;font-size:23px;transition:all .3s;text-align:center;line-height:1.15}
.node small{display:block;font-size:16px;font-weight:600;opacity:.8;margin-top:4px}
.node:hover{transform:scale(1.06)}
.node.on{background:var(--gold);color:#262525;box-shadow:0 0 36px rgba(219,191,78,.6)}
.ringsvg{position:absolute;inset:0;pointer-events:none}
.loopinfo{flex:1}
.loopinfo .infocard{min-height:360px}
.loopinfo .quote{margin-top:18px;font-size:21px;opacity:.8;font-style:italic;line-height:1.4}

/* ===== slide 8 (light) ===== */
.s8 .steps8{position:absolute;left:110px;top:296px;width:640px;display:flex;flex-direction:column;gap:14px;z-index:4}
.step8{display:flex;align-items:center;gap:20px;text-align:left;border:2px solid var(--gold-d);background:#F8F5EA;border-radius:16px;padding:20px 24px;font-size:28px;font-weight:700;color:var(--ink);transition:all .3s}
.step8 .n{flex:none;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-size:26px;font-weight:800}
.step8 small{display:block;font-size:19px;font-weight:500;opacity:.75;margin-top:2px}
.step8:hover{transform:translateX(6px)}
.step8.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.step8.on .n{background:var(--gold);color:#262525}
.s8 .detail{position:absolute;left:800px;right:110px;top:296px;z-index:4;display:flex;flex-direction:column;gap:16px}
.dbox{border-radius:16px;padding:20px 26px;border:1.5px solid var(--gold-d);background:#F8F5EA}
.dbox.dk{background:linear-gradient(135deg,#4a4848,#333131);color:#fff;border-color:#333}
.dbox small{display:block;font-size:17px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);margin-bottom:6px}
.dbox.dk small{color:var(--gold)}
.dbox p{font-size:26px;line-height:1.4;font-weight:500}
.dbox.q p{font-size:30px;font-weight:700;line-height:1.3}
.s8 .ask{position:absolute;left:110px;right:110px;bottom:170px;z-index:4;font-size:24px;font-weight:600;border-left:6px solid var(--gold-d);padding:12px 0 12px 22px;color:var(--ink)}
.s8 .ask b{color:var(--gold-d)}

/* ===== slide 9 ===== */
.s9 .tabs{position:absolute;left:110px;top:298px;z-index:6}
.s9 .panes{position:absolute;left:110px;right:110px;top:384px;z-index:4}
.vennrow{display:flex;gap:40px}
.venn{position:relative;width:760px;height:620px;flex:none;transform:scale(.8);transform-origin:0 0;margin-right:-150px;margin-bottom:-124px}
.vc{position:absolute;width:400px;height:400px;border-radius:50%;border:2.5px solid;pointer-events:none;transition:all .4s}
.vc.d{left:180px;top:0;background:rgba(219,191,78,.26);border-color:var(--gold)}
.vc.t{left:20px;top:214px;background:rgba(255,255,255,.16);border-color:#fff}
.vc.h{left:340px;top:214px;background:rgba(232,149,107,.26);border-color:var(--coral)}
.vc.dim{opacity:.35}
.vl{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;font-size:30px;font-weight:800;text-align:center;line-height:1.15;padding:10px 14px;border-radius:12px;transition:all .25s;color:#fff;z-index:3}
.vl small{display:block;font-size:20px;font-weight:600;opacity:.85;margin-top:3px}
.vl:hover{background:rgba(255,255,255,.14)}
.vl.on{background:rgba(255,255,255,.22);box-shadow:0 0 0 2px var(--gold)}
.vl.center{background:var(--gold);color:#262525;border-radius:50%;width:150px;height:150px;font-size:22px;display:grid;place-items:center;box-shadow:0 0 30px rgba(219,191,78,.7);animation:spin-glow 3s infinite}
.vl.center.on{background:#fff;color:#262525}
.vinfo{flex:1}

/* helpers */
function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}

function bindList(root,sel,cb){const items=$$(sel,root);items.forEach((b,i)=>b.onclick=()=>{items.forEach(x=>x.classList.toggle('on',x===b));cb(i,b)});return items}
function segs(root,cb){const b=$$('.seg',root);b.forEach((x,i)=>x.onclick=()=>{b.forEach(y=>y.classList.toggle('on',y===x));cb(i,x)})}
function ring(host,o){ // o:{w,h,nodes:[{x,y,l,s}],r,center:{x,y,r,t}}
  host.style.width=o.w+'px';host.style.height=o.h+'px';host.classList.add('ringw');
  const n=o.nodes,r=o.r;
  let svg=`<svg viewBox="0 0 ${o.w} ${o.h}"><defs><marker id="ar${o.id}" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,1 L11,6 L0,11 z" fill="#DBBF4E"/></marker></defs>`;
  n.forEach((a,i)=>{const b=n[(i+1)%n.length];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const ux=dx/d,uy=dy/d;
    svg+=`<line x1="${a.x+ux*(r+6)}" y1="${a.y+uy*(r+6)}" x2="${b.x-ux*(r+14)}" y2="${b.y-uy*(r+14)}" stroke="#DBBF4E" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#ar${o.id})"/>`});
  svg+='</svg>';
  let h=svg;
  if(o.center)h+=`<div class="rcore" style="left:${o.center.x-o.center.r}px;top:${o.center.y-o.center.r}px;width:${o.center.r*2}px;height:${o.center.r*2}px">${o.center.t}</div>`;
  n.forEach((a,i)=>{h+=`<button class="rn" data-i="${i}" style="left:${a.x-r}px;top:${a.y-r}px;width:${r*2}px;height:${r*2}px;font-size:${o.fs||21}px">${a.l}${a.s?`<small>${a.s}</small>`:''}</button>`});
  host.innerHTML=h;return $$('.rn',host);
}
function bars(host,rows,cls){host.innerHTML=rows.map((r,i)=>`<div class="bar1"><span>${r.l}</span><div class="tr"><i data-w="${r.w}" class="${r.c||''}"></i></div><span class="v">${r.v}</span></div>`).join('')}
function setBars(host,rows){$$('.bar1',host).forEach((b,i)=>{$('i',b).style.width=rows[i].w+'%';$('i',b).className=rows[i].c||'';$('.v',b).textContent=rows[i].v;$('span',b).textContent=rows[i].l})}

/* build slides */
function mk(d,idx){
  const s=document.createElement('section');const light=d.t==='light';
  s.className=`slide ${light?'light':'dark'} ${d.t==='photo'?'photo':''} ${d.cls||''}`;
  s.dataset.theme=light?'light':'dark';s.dataset.title=d.title;
  s.innerHTML=d.raw?d.raw:`<img class="logo edu-tr" src="${light?IMG.eduD:IMG.eduW}" alt=""><img class="logo ibero-bl" src="${light?IMG.ibD:IMG.ibW}" alt=""><div class="deco"></div>
  <div class="ttl"><div class="kicker rv">${d.k}</div><h2 class="rv" style="--d:1">${d.h}</h2></div><div class="area rv" style="--d:2">${d.html}</div>`;
  $('#slides').appendChild(s);return s;
}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
function go(n){
  n=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===n));cur=n;stage.dataset.theme=slides[n].dataset.theme;
  $$('#dots i').forEach((d,i)=>d.classList.toggle('on',i===n));$$('#idxlist a').forEach((a,i)=>a.classList.toggle('on',i===n));
  $('#cnt').textContent=String(n+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  $('#prog').style.width=((n+1)/slides.length*100)+'%';
  try{history.replaceState(null,'','#'+(n+1))}catch(e){}
  if(hooks[n])hooks[n]();
}
function boot(){
  DEFS.forEach((d,i)=>{const s=mk(d,i);slides.push(s);d._s=s});
  $$('[data-tabs]').forEach(g=>{const btns=$$('.tab',g);btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>{x.classList.toggle('on',x===b);const p=$('#'+x.dataset.p);if(p)p.classList.toggle('on',x===b)})})});
  DEFS.forEach((d,i)=>{if(d.init)d.init(d._s);if(d.enter)hooks[i]=()=>d.enter(d._s)});
  const dots=$('#dots');
  slides.forEach((s,i)=>{const d=document.createElement('i');d.title=s.dataset.title;d.onclick=()=>go(i);dots.appendChild(d);
    const a=document.createElement('a');a.innerHTML=`<b>${i+1}</b><span>${s.dataset.title}</span>`;a.onclick=()=>{go(i);$('#index').classList.remove('open')};$('#idxlist').appendChild(a)});
  addEventListener('resize',fit);fit();
  $('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);
  $('#bIdx').onclick=()=>$('#index').classList.toggle('open');
  $('#bFs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
  $$('[data-next]').forEach(b=>b.onclick=()=>go(cur+1));
  addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA')return;const k=e.key;
    if(k==='ArrowRight'||k==='PageDown')go(cur+1);else if(k==='ArrowLeft'||k==='PageUp')go(cur-1);
    else if(k===' '&&t!=='BUTTON'){e.preventDefault();go(cur+1)}
    else if(k==='Home')go(0);else if(k==='End')go(slides.length-1);
    else if(k==='f'||k==='F')$('#bFs').click();else if(k==='m'||k==='M')$('#bIdx').click();
    else if(k==='Escape'){$('#index').classList.remove('open');$$('.refs.open').forEach(r=>r.classList.remove('open'))}
    else if(/^[1-9]$/.test(k))go(+k-1)});
  let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));tx=null});
  /* particles */
  const c=$('#fx'),x=c.getContext('2d');const P=Array.from({length:46},()=>({x:Math.random()*1920,y:Math.random()*1080,r:1.5+Math.random()*3.5,vx:(Math.random()-.5)*.35,vy:-.15-Math.random()*.35,a:.15+Math.random()*.4}));
  (function f(){x.clearRect(0,0,1920,1080);for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=1090;p.x=Math.random()*1920}if(p.x<-10)p.x=1930;if(p.x>1930)p.x=-10;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle=`rgba(219,191,78,${p.a})`;x.fill()}requestAnimationFrame(f)})();
  const h=parseInt(location.hash.slice(1));go(h>=1&&h<=slides.length?h-1:0);
}
